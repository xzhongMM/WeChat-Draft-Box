<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // Redirect all 404s back to the app while preserving the path
      const path = window.location.pathname + window.location.search + window.location.hash;
      const base = "/WeChat-Draft-Box";
      sessionStorage.setItem("redirect", path);
      window.location.replace(base + "/");
    </script>
  </head>
  <body></body>
</html>
